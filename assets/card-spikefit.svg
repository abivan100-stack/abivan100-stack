ike &amp; shoe finder</text><text x="28" y="138" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#CBD5E1">Helps runners and track athletes pick</text><text x="28" y="160" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#CBD5E1">the right spikes by event, surface and</text><text x="28" y="182" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#CBD5E1">foot strike.</text><g transform="translate(398 112)"><path d="M-49.4 -42.9 H49.4 A42.9 42.9 0 0 1 49.4 42.9 H-49.4 A42.9 42.9 0 0 1 -49.4 -42.9 Z" fill="none" stroke="#334155" stroke-width="2"/><path d="M-26.599999999999998 -23.099999999999998 H26.599999999999998 A23.099999999999998 23.099999999999998 0 0 1 26.599999999999998 23.099999999999998 H-26.599999999999998 A23.099999999999998 23.099999999999998 0 0 1 -26.599999999999998 -23.099999999999998 Z" fill="none" stroke="#334155" stroke-width="2"/><path id="trk" d="M-38 -33 H38 A33 33 0 0 1 38 33 H-38 A33 33 0 0 1 -38 -33 Z" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 6"/><circle r="5" fill="#F59E0B" opacity="1" filter="url(#glow)"><animateMotion dur="3.6s" begin="-0.0s" repeatCount="indefinite" path="M-38 -33 H38 A33 33 0 0 1 38 33 H-38 A33 33 0 0 1 -38 -33 Z"/></circle><circle r="3.8" fill="#F59E0B" opacity="0.55" filter="url(#glow)"><animateMotion dur="3.6s" begin="-0.16s" repeatCount="indefinite" path="M-38 -33 H38 A33 33 0 0 1 38 33 H-38 A33 33 0 0 1 -38 -33 Z"/></circle><circle r="2.6" fill="#F59E0B" opacity="0.3" filter="url(#glow)"><animateMotion dur="3.6s" begin="-0.32s" repeatCount="indefinite" path="M-38 -33 H38 A33 33 0 0 1 38 33 H-38 A33 33 0 0 1 -38 -33 Z"/></circle></g><line x1="28" y1="208" x2="452" y2="208" stroke="#1E293B" stroke-width="1.5"/><text x="28" y="230" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#94